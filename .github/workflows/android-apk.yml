name: Build and test Galaxy J7 APK
on:
  push:
    branches: [main]
    paths:
      - 'artifacts/wealthtrack/**'
      - 'scripts/android-startup-smoke.sh'
      - 'scripts/check-j7-apk.py'
      - 'scripts/android-finance-flow.py'
      - '.github/workflows/android-apk.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
jobs:
  apk:
    # UI-only rechecks validate the existing ARM/x86 artifacts in the recheck workflow.
    if: ${{ !contains(github.event.head_commit.message, 'UI-only recheck') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install required NDK with download retries
        run: |
          for attempt in 1 2 3; do
            if sdkmanager --install 'ndk;27.1.12297006'; then break; fi
            rm -rf "$ANDROID_HOME/.temp"
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Install dependencies and run regressions
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/wealthtrack typecheck
          node scripts/run-finance-regressions.mjs
          pnpm --filter @workspace/wealthtrack exec expo prebuild --platform android --no-install
      - name: Test parser and build standalone J7 APK
        working-directory: artifacts/wealthtrack/android
        run: ./gradlew :money-notifications:testReleaseUnitTest :app:assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - name: Sign and verify for Android 7 through Android 9
        run: |
          mkdir -p apk-download
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" sign --ks artifacts/wealthtrack/android/app/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false --min-sdk-version 24 --out apk-download/Pro-Financer-J7.apk artifacts/wealthtrack/android/app/build/outputs/apk/release/app-release.apk
          "$signer" verify --verbose --print-certs --min-sdk-version 24 --max-sdk-version 28 apk-download/Pro-Financer-J7.apk > apk-download/SIGNATURE-VERIFICATION.txt
          python scripts/check-j7-apk.py apk-download/Pro-Financer-J7.apk > apk-download/APK-VERIFICATION.json
          sha256sum apk-download/Pro-Financer-J7.apk > apk-download/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pro-Financer-J7-APK
          path: apk-download/
          retention-days: 30
          if-no-files-found: error
  startup:
    if: ${{ !contains(github.event.head_commit.message, 'UI-only recheck') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install required NDK with download retries
        run: |
          for attempt in 1 2 3; do
            if sdkmanager --install 'ndk;27.1.12297006'; then break; fi
            rm -rf "$ANDROID_HOME/.temp"
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
      - name: Install and generate Android project
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/wealthtrack exec expo prebuild --platform android --no-install
      - name: Build release app for 32-bit runtime tests
        working-directory: artifacts/wealthtrack/android
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=x86,x86_64 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      - uses: actions/upload-artifact@v4
        with:
          name: J7-x86-runtime
          path: artifacts/wealthtrack/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
  device-tests:
    needs: startup
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 24, arch: x86, target: default, profile: Nexus 5, ram: 1536M}
          - {api: 28, arch: x86, target: default, profile: Nexus 5, ram: 1536M}
          - {api: 36, arch: x86_64, target: google_apis, profile: pixel_2, ram: 2048M}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: J7-x86-runtime
          path: artifacts/wealthtrack/android/app/build/outputs/apk/release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test finance and SMS capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target }}
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.ram }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-startup-smoke.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-startup-evidence-${{ matrix.api }}
          path: startup-evidence/
          if-no-files-found: ignore
  publish:
    needs: [apk, device-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Pro-Financer-J7-APK
          path: apk-download
      - name: Publish tested J7 APK
        run: |
          sha256sum -c apk-download/SHA256SUMS.txt
          changes=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main" --jq '.files[] | select((.filename | startswith("artifacts/wealthtrack/")) or .filename == "pnpm-lock.yaml" or .filename == "pnpm-workspace.yaml" or .filename == "package.json") | .filename')
          test -z "$changes"
          if ! gh release view v1.4.0-j7 >/dev/null 2>&1; then
            gh release create v1.4.0-j7 --target "$GITHUB_SHA" --title "Pro Financer 1.4.0 for Android 7+" --notes "New ivory, black and gold design and app logo. Live personal bill dues and repayment history, Loans with due dates and monthly dashboard reserves, Profile in Settings, actual spending graphs and stronger repeated-bank-alert review. Bill and loan records update dues only; cash is matched or recorded separately. Existing saved data and backups migrate. ARM32 and ARM64, Android 7+. Preview signed with the Android test key; physical-phone checks remain necessary." --prerelease --latest=false
          fi
          gh release upload v1.4.0-j7 apk-download/Pro-Financer-J7.apk apk-download/SHA256SUMS.txt apk-download/SIGNATURE-VERIFICATION.txt apk-download/APK-VERIFICATION.json --clobber
