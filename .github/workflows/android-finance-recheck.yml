name: Verify J7 finance screens and publish checked APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-finance-recheck.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: j7-finance-recheck
  cancel-in-progress: true
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the tested application source is unchanged
        run: |
          changes=$(gh api "repos/${GITHUB_REPOSITORY}/compare/9407c17153610dd7115ecf3ecc733fafbe914aee...${GITHUB_SHA}" --jq '.files[] | select((.filename | startswith("artifacts/wealthtrack/")) or .filename == "pnpm-lock.yaml" or .filename == "pnpm-workspace.yaml" or .filename == "package.json") | .filename')
          test -z "$changes"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/37825873382/jobs" --jq '.jobs[] | select(.name == "apk") | .conclusion')" = success
      - uses: actions/download-artifact@v4
        with:
          name: J7-x86-runtime
          github-token: ${{ github.token }}
          run-id: 37825873382
          path: artifacts/wealthtrack/android/app/build/outputs/apk/release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check finance screens on Android 7
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86
          target: default
          profile: Nexus 5
          ram-size: 1536M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-startup-smoke.sh 24
      - name: Check finance screens on Android 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86
          target: default
          profile: Nexus 5
          ram-size: 1536M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-startup-smoke.sh 28
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-finance-screen-evidence
          path: startup-evidence/
          if-no-files-found: error
  publish:
    needs: screens
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Pro-Financer-J7-APK
          github-token: ${{ github.token }}
          run-id: 37825873382
          path: apk-download
      - name: Verify and publish the existing checked ARM build
        run: |
          sha256sum -c apk-download/SHA256SUMS.txt
          python scripts/check-j7-apk.py apk-download/Pro-Financer-J7.apk > apk-download/APK-VERIFICATION.json
          changes=$(gh api "repos/${GITHUB_REPOSITORY}/compare/9407c17153610dd7115ecf3ecc733fafbe914aee...main" --jq '.files[] | select((.filename | startswith("artifacts/wealthtrack/")) or .filename == "pnpm-lock.yaml" or .filename == "pnpm-workspace.yaml" or .filename == "package.json") | .filename')
          test -z "$changes"
          if ! gh release view v1.1.3-j7 >/dev/null 2>&1; then
            gh release create v1.1.3-j7 --target main --title "Pro Financer 1.1.3 for Galaxy J7" --notes "Corrected name input, salary plus starting-savings dashboard balance, expense deductions and dream savings. Smaller 32-bit ARM APK for Android 7 or newer. Unused sensitive permissions removed; automatic capture still requires notification access and Google Play Protect may restrict sideloaded listener apps. TypeScript, six regression suites, native parser, APK signature/manifest checks and Android 7/9 finance-screen tests passed. Emulator tests do not guarantee installation or keyboard behavior on a physical Samsung. Personal test signing key; Google login needs Supabase configuration." --prerelease --latest=false
          fi
          gh release upload v1.1.3-j7 apk-download/Pro-Financer-J7.apk apk-download/SHA256SUMS.txt apk-download/SIGNATURE-VERIFICATION.txt apk-download/APK-VERIFICATION.json --clobber
